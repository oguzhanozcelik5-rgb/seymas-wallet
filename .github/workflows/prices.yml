name: Update prices

# One run keeps prices.json fresh for almost 6 hours (a refresh every 5 minutes),
# then starts the next run itself, so the feed never depends on GitHub's
# scheduler. The schedule is only a backup in case the chain ever breaks.
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/scripts/fetch-prices.mjs, .github/workflows/prices.yml]

permissions:
  contents: write
  actions: write

concurrency:
  group: prices
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh prices every 5 minutes
        env:
          PUSH_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          end=$(( $(date +%s) + 340 * 60 ))
          while [ "$(date +%s)" -lt "$end" ]; do
            # Pick up script changes without restarting.
            git fetch -q origin main && git checkout -q origin/main -- .github/scripts || true
            if node .github/scripts/fetch-prices.mjs; then
              # Publish prices.json on its own branch, replacing the previous copy,
              # so the main branch and the website are left alone.
              (cd out && rm -rf .git && git init -q -b prices && git add prices.json names.json \
                && git commit -qm "Prices $(date -u +%FT%TZ)" && git push -qf "$PUSH_URL" prices) || echo "publish failed"
            fi
            sleep 300
          done
      - name: Start the next run
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run prices.yml --ref main --repo "${{ github.repository }}"
