name: Probe Harem Altın (temporary)
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: |
          cat > probe.mjs <<'JS'
          const UA = 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36';
          function tryEio(eio, withHeaders) {
            return new Promise((resolve) => {
              const url = `wss://hrmsocketonly.haremaltin.com/socket.io/?EIO=${eio}&transport=websocket`;
              let ws;
              try {
                ws = withHeaders ? new WebSocket(url, { headers: { 'User-Agent': UA, Origin: 'https://www.haremaltin.com' } }) : new WebSocket(url);
              } catch (e) { console.log('ctor error', e.message); return resolve(false); }
              const done = (v) => { try { ws.close(); } catch {} resolve(v); };
              const timer = setTimeout(() => { console.log(`EIO=${eio} headers=${withHeaders}: timeout`); done(false); }, 25000);
              ws.onopen = () => console.log(`EIO=${eio} headers=${withHeaders}: open`);
              ws.onerror = (e) => { console.log(`EIO=${eio}: error`, e.message || e.type); clearTimeout(timer); done(false); };
              ws.onclose = (e) => console.log(`EIO=${eio}: close`, e.code, e.reason);
              ws.onmessage = (m) => {
                const t = String(m.data);
                if (t[0] === '0') { console.log('handshake', t.slice(0, 200)); ws.send('40'); return; }
                if (t === '2') { ws.send('3'); return; }
                console.log('msg', t.length, t.slice(0, 2500));
                if (t.startsWith('42')) { clearTimeout(timer); done(true); }
              };
            });
          }
          for (const [eio, h] of [[4, true], [4, false], [3, true]]) { if (await tryEio(eio, h)) break; }
          process.exit(0);
          JS
          node probe.mjs
